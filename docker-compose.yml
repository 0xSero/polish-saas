  dokumentownik-frontend:
    build:
      context: ./apps/dokumentownik/frontend
    ports:
      - "3008:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8008
    volumes:
      - ./apps/dokumentownik/frontend:/app
      - /app/node_modules

  # App 9: EventRadar Polska
  eventradar-backend:
    build:
      context: ./apps/eventradar-polska/backend
    ports:
      - "8009:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eventradar
      REDIS_URL: redis://redis:6379/8
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/eventradar-polska/backend:/app

  eventradar-frontend:
    build:
      context: ./apps/eventradar-polska/frontend
    ports:
      - "3009:3000"

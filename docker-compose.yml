      context: ./apps/dzialkowiec-planner/backend
    ports:
      - "8006:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/dzialkowiec
      REDIS_URL: redis://redis:6379/5
    depends_on:
      - postgres
      - redis
    volumes:
      - ./apps/dzialkowiec-planner/backend:/app

  dzialkowiec-frontend:
    build:
      context: ./apps/dzialkowiec-planner/frontend
    ports:
      - "3006:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8006

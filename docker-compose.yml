    ports:
      - "3005:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8005
    volumes:
      - ./apps/darmoswap/frontend:/app
      - /app/node_modules

  # App 6: Działkowiec Planner
  dzialkowiec-backend:
